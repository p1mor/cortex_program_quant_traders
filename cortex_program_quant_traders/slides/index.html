<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cortex Quant Trader — Programa Formativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/slides.css?v=20260816-7" />
  <style>
    /* El estado de carga siempre debe ser visible. Si un script falla, el
       navegador muestra un diagnóstico en lugar de una pantalla negra. */
    .slide-deck { opacity: 1; transition: opacity .15s ease; }
    .deck-status {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #000;
      color: #8b95a5;
      font: 12px/1.6 "JetBrains Mono", monospace;
      letter-spacing: .08em;
      text-align: center;
    }
    .deck-status strong { display: block; margin-bottom: 10px; color: #00e5ff; }

    /* El índice usa una retícula propia, aislada para no alterar los slides. */
    #slide-1 .header-divider { width: 1px; height: 22px; background: var(--border-default); }
    #slide-1 .slide-body {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(18px, 1.7vw, 32px);
      padding: clamp(24px, 3vh, 42px) clamp(30px, 3.2vw, 62px);
      overflow: hidden;
    }
    #slide-1 .module {
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: clamp(24px, 2.2vw, 40px);
      border: 1px solid var(--border-default);
      background: rgba(7, 8, 10, .94);
    }
    #slide-1 .module-header { position: relative; padding-left: 18px; }
    #slide-1 .module-header::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 2px; background: currentColor; }
    #slide-1 .module-number { font: 700 10px/1.2 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: inherit; }
    #slide-1 .module-title { margin: 12px 0 0; font: 600 clamp(18px, 1.35vw, 25px)/1.08 var(--font-display); color: inherit; }
    #slide-1 .module-line { width: 48px; height: 1px; margin-top: 22px; background: currentColor; }
    #slide-1 .topic-list { display: flex; flex-direction: column; margin-top: clamp(20px, 2.2vh, 32px); }
    #slide-1 .topic {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      align-items: center;
      min-height: clamp(27px, 3.25vh, 35px);
      border-bottom: 1px solid var(--border-subtle);
      font-size: clamp(9px, .68vw, 12px);
      line-height: 1.25;
    }
    #slide-1 .topic:last-child { border-bottom: 0; }
    #slide-1 .topic-number { font-family: var(--font-mono); color: var(--txt-tertiary); }
    #slide-1 .topic-text { min-width: 0; color: var(--txt-secondary); }
    #slide-1 .module-summary {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
    }
    #slide-1 .module-summary-label { font: 600 9px/1.2 var(--font-mono); letter-spacing: .13em; text-transform: uppercase; color: var(--txt-tertiary); }
    #slide-1 .module-summary-value { font: 700 clamp(24px, 2vw, 34px)/1 var(--font-mono); }
    #slide-1 .module-1 { color: var(--accent); }
    #slide-1 .module-2 { color: var(--purple); }
    #slide-1 .module-3 { color: var(--cyan); }
    #slide-1 .module .topic-text { color: var(--txt-secondary); }

    @media (max-width: 900px) {
      #slide-1 .slide-body { grid-template-columns: 1fr; overflow-y: auto; }
      #slide-1 .module { min-height: 620px; }
    }
  </style>
</head>
<body>
  <div class="slide-deck" aria-live="polite">
    <div class="deck-status" id="deck-status">
      <div><strong>CORTEX QUANT TRADER</strong>Cargando programa formativo…</div>
    </div>
  </div>

  <noscript>
    <div class="deck-status"><div><strong>JavaScript requerido</strong>Abre la presentación desde el servidor local para cargar todos los módulos.</div></div>
  </noscript>

  <script src="js/loader.js?v=20260816-7"></script>
  <script>
    document.documentElement.dataset.deckLoading = 'true';

    window.CortexDeckReady = (async function loadDeck() {
      const deck = document.querySelector('.slide-deck');
      if (!deck) return 0;

      try {
        if (typeof SlideLoader === 'undefined') {
          throw new Error('No se pudo iniciar js/loader.js');
        }

        const stagingDeck = document.createElement('div');
        const loaded = await SlideLoader.loadAll(stagingDeck);

        if (!loaded) {
          throw new Error('El cargador no encontró ningún slide');
        }

        deck.replaceChildren(...stagingDeck.children);

        /* Respaldo de visibilidad: el primer slide nunca debe depender de que
           el motor de navegación gane una carrera contra DOMContentLoaded. */
        const firstSlide = deck.querySelector('.slide');
        if (firstSlide) firstSlide.classList.add('visible');
        if (typeof renderMathInElement === 'function') {
          try {
            renderMathInElement(deck, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false }
              ],
              throwOnError: false,
              strict: false
            });
          } catch (mathError) {
            console.warn('[CortexDeck:math]', mathError);
          }
        }

        return loaded;
      } catch (error) {
        console.error('[CortexDeck]', error);
        deck.innerHTML = '<div class="deck-status"><div><strong>ERROR AL CARGAR LA PRESENTACIÓN</strong>'
          + String(error && error.message ? error.message : error)
          + '<br><br>Recarga con Ctrl + F5.</div></div>';
        return 0;
      } finally {
        delete document.documentElement.dataset.deckLoading;
      }
    })();
  </script>
  <script src="js/navigation.js?v=20260816-7"></script>
  <script>
    window.CortexDeckReady.then((loaded) => {
      /* SlideNav se declara con const en navigation.js: existe en el ámbito
         global léxico, pero no necesariamente como propiedad de window. */
      if (loaded && typeof SlideNav !== 'undefined') SlideNav.init();
    }).catch((error) => {
      delete document.documentElement.dataset.deckLoading;
      console.error('[CortexDeckReady]', error);
    });
  </script>
</body>
</html>

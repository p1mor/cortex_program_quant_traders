<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slide Viewer — Cortex Quant Trader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ez1z02Mkd1+2OdO" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-6YkR/WTIeM03Gd/Gg2Y02FKAtWMH2qWz02vN6pJGN2vB62OLH2F6Lfj3Gk1v1B0" crossorigin="anonymous"
    onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});"></script>
  <link rel="stylesheet" href="css/slides.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#000; }
    #slide-container { width:100vw; max-width:100vw; min-width:0; height:100vh; overflow:hidden; }
    .slide { width:100vw; height:100vh; }
    .viewer-info { position:fixed; bottom:var(--sp-4); left:var(--sp-4); z-index:100;
      font-family:var(--font-mono); font-size:var(--fs-micro); color:var(--txt-tertiary);
      background:var(--bg-panel); border:1px solid var(--border-default); padding:var(--sp-2) var(--sp-3); }
    .viewer-info a { color:var(--accent); }
    @media (max-width: 600px) {
      .slide-header .concept-code { display:none; }
      .viewer-info { max-width:calc(100vw - 2rem); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    }
  </style>
</head>
<body>
  <div id="slide-container"></div>
  <div class="viewer-info">
    <a href="index.html">Volver al programa</a> &middot; Archivo: <span id="file-name">—</span>
  </div>
  <script>
    (async function() {
      const params = new URLSearchParams(location.search);
      const file = params.get('slide');
      if (!file) {
        const msg = document.createElement('div');
        msg.style.cssText = 'color:#6b7280;font-family:monospace;text-align:center;padding:4rem;';
        msg.textContent = 'Especifica ?slide=modules/m0/00-portada.html';
        document.getElementById('slide-container').appendChild(msg);
        return;
      }
      document.getElementById('file-name').textContent = file;
      try {
        const resp = await fetch(file, { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const html = await resp.text();
        const container = document.getElementById('slide-container');
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const slide = doc.querySelector('.slide');
        if (slide) {
          container.innerHTML = '';
          container.appendChild(document.importNode(slide, true));
          slide.classList.add('visible');
        } else {
          container.textContent = html;
        }
      } catch(e) {
        const err = document.createElement('div');
        err.style.cssText = 'color:#e63955;font-family:monospace;text-align:center;padding:4rem;';
        err.textContent = 'Error cargando: ' + file;
        document.getElementById('slide-container').innerHTML = '';
        document.getElementById('slide-container').appendChild(err);
      }
    })();
  </script>
</body>
</html>
